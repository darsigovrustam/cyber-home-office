<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проверка цифровой безопасности — прототип опросника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#1B2233; --ink-2:#4A5568; --ink-3:#8A94A6;
  --line:#D6DCE5; --accent:#0F6E68; --accent-soft:#DCEFEC; --tag:#EAE3F5; --tag-ink:#5B3F8A;
  --new:#FFF1D6; --new-ink:#8A5A00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141922; --paper:#1D2430; --ink:#EEF1F5; --ink-2:#B9C2D0; --ink-3:#7E889A; --line:#2E3745;
  --accent:#4DB6AC; --accent-soft:#1F3A38; --tag:#33294A; --tag-ink:#CDB9F0; --new:#3D3116; --new-ink:#F0C46A;
}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 120px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
header .brand{font-weight:600;font-size:15px;color:var(--ink-2)}
.toggle{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.progress{display:flex;gap:4px;margin:14px 0 26px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.cur{background:var(--accent);opacity:.5}
.section-title{font-size:13px;color:var(--ink-3);margin:0 0 4px}
h1{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.25;margin:0 0 22px;font-weight:700;letter-spacing:-.01em}
p.lead{font-size:18px;color:var(--ink-2);margin:0 0 16px}
.q{background:var(--paper);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;border:1px solid var(--line)}
.q .t{font-weight:600;font-size:17px;margin:0 0 4px}
.q .why{font-size:14px;color:var(--ink-2);margin:0 0 12px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:16px;line-height:1.35;background:var(--paper)}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--ink-3);border-radius:6px;margin-top:2px;position:relative}
.opt.radio .box{border-radius:50%}
.opt.on .box{border-color:var(--accent);background:var(--accent)}
.opt.on .box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--tag);color:var(--tag-ink);font-weight:600}
.tag.new{background:var(--new);color:var(--new-ink)}
.tag.branch{background:var(--line);color:var(--ink-2);font-weight:500}
body.nocodes .meta{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:14px 18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);flex:1}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--ink-3);margin:6px 0 0}
.summary .row{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.summary .row .k{color:var(--ink-3);font-size:13px;white-space:nowrap}
.summary .row .a{color:var(--accent);font-weight:600}
.summary h3{font-size:15px;color:var(--ink-3);margin:22px 0 4px;font-weight:600}
.note{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15px;color:var(--ink-2);margin:0 0 18px}
.note b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .q{animation:in .18s ease-out} @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Cyber Office · проверка</div>
    <div style="display:flex;gap:14px"><label class="toggle"><input type="checkbox" id="codes" checked> коды факторов</label><label class="toggle"><input type="checkbox" id="debug"> debug: далее без ответов</label></div>
  </header>
  <div class="progress" id="progress"></div>
  <div id="screen"></div>
</div>
<div class="nav"><div class="in">
  <button id="back">Назад</button>
  <button id="next" class="primary">Дальше</button>
</div></div>

const A = {}; let cur = 0; let DEBUG = false;
const $ = s => document.querySelector(s);
const visible = () => S.filter(s => !s.showIf || s.showIf(A));

function render(){
  const list = visible(); if (cur >= list.length) cur = list.length-1;
  const s = list[cur]; const el = $('#screen'); el.innerHTML='';
  // progress
  $('#progress').innerHTML = list.filter(x=>x.id!=='intro'&&x.id!=='done').map((x,i)=>{
    const idx = list.indexOf(x); return `<i class="${idx<cur?'done':idx===cur?'cur':''}"></i>`;}).join('');
  if (s.screen==='intro'){
    el.innerHTML = `<h1>Проверьте, насколько вы уязвимы</h1>
    <p class="lead">Это не проверка знаний. Правильных ответов здесь нет, а ваши отметки никуда не отправляются.</p>
    <p class="lead">За несколько минут вы увидите, что именно у вас могут отнять, каким способом это сделают и с чего начать защиту.</p>
    <div class="note"><b>Прототип для ревью.</b> Оценка не считается. Переключатель «коды факторов» показывает привязку каждого вопроса к модели; оранжевые метки — факторы, которых не было в обсуждённых плоскостях. Ветки открываются от ответов первого экрана.</div>`;
    $('#back').style.visibility='hidden'; $('#next').textContent='Начать'; $('#next').disabled=false; return;
  }
  if (s.screen==='done'){ renderDone(el); $('#back').style.visibility='visible'; $('#next').textContent='Сначала'; $('#next').disabled=false; return; }
  $('#back').style.visibility='visible'; $('#next').textContent='Дальше';
  const qs = s.q.filter(q=>!q.showIf||q.showIf(A));
  el.innerHTML = `<p class="section-title">${s.title}</p><h2>${s.lead||s.title}</h2>`;
  qs.forEach(q=>{
    const d = document.createElement('div'); d.className='q';
    d.innerHTML = `<p class="t"><span style="color:var(--ink-3);font-weight:500">${q.id}.</span> ${q.t}</p>${q.d?`<p class="why">${q.d}</p>`:''}<div class="opts"></div>
      <div class="meta"><span class="tag${q.nw?' new':''}">${q.code}</span>${q.nw?'<span class="tag new">новый фактор</span>':''}${q.showIf?'<span class="tag branch">ветка</span>':''}<span class="tag branch">${q.type==='multi'?'несколько':'один'}</span></div>`;
    const box = d.querySelector('.opts');
    q.o.forEach((label,i)=>{
      const o = document.createElement('div'); o.className='opt'+(q.type==='single'?' radio':''); o.tabIndex=0;
      o.innerHTML = `<span class="box"></span><span>${label}</span>`;
      const on = ()=> q.type==='single' ? A[q.id]===i : Array.isArray(A[q.id])&&A[q.id].includes(i);
      if (on()) o.classList.add('on');
      const pick = ()=>{
        if (q.type==='single'){ A[q.id]=i; }
        else { let arr = Array.isArray(A[q.id])?[...A[q.id]]:[];
          if (arr.includes(i)) arr=arr.filter(x=>x!==i);
          else { if (q.none!==null && q.none!==undefined){ if (i===q.none) arr=[i]; else arr=arr.filter(x=>x!==q.none); } arr.push(i); }
          A[q.id]=arr; }
        render(); window.scrollTo({top:window.scrollY});
      };
      o.onclick=pick; o.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();pick();} };
      box.appendChild(o);
    });
    el.appendChild(d);
  });
  const all = qs.every(q=> q.type==='single' ? A[q.id]!==undefined : Array.isArray(A[q.id])&&A[q.id].length>0);
  $('#next').disabled = !all && !DEBUG;
  el.insertAdjacentHTML('beforeend', `<p class="hint">${all?'':(DEBUG?'Режим debug: можно идти дальше без ответов.':'Ответьте на все вопросы экрана, чтобы идти дальше.')}</p>`);
}

  // Сценарии
  r.scen = T.filter(t=>t.trig()).map(t=>({...t, wt:t.w()}));
  // вероятность сценария 1–5: базовая из P (0–3) + усиливающие условия (до 2)
  r.scen.forEach(sc=>{ sc.p = Math.max(1, Math.min(5, Math.round(1 + 3*r.P/100 + 0.5*Math.min(sc.wt,3)))); });
  // Риски: угроза × сценарий
  const want = val('54');
  r.risks = [];
  r.threats.forEach(th=>{ const d = Math.min(5, th.dmg() + (th.irr?1:0) + (th.m54===want?1:0));
    r.scen.filter(sc=>sc.th.includes(th.id)).forEach(sc=>{ r.risks.push({th, sc, p:sc.p, d, risk:sc.p*d}); }); });
  r.risks.sort((a,b)=>(b.risk-a.risk) || ((b.th.m54===want)-(a.th.m54===want)) || (b.p-a.p));
  r.irr = r.risks.some(x=>x.th.irr && x.risk>=8);
  // Отбор сценариев для карточек: по максимальному риску, который они реализуют
  const best = {}; r.risks.forEach(x=>{ best[x.sc.id]=Math.max(best[x.sc.id]||0,x.risk); });
  const sorted=[...r.scen].sort((a,b)=>(best[b.id]||0)-(best[a.id]||0));
  r.entry = sorted.filter(t=>t.entry).slice(0,2);
  r.cons = sorted.filter(t=>!t.entry).slice(0,3);
  return r;
}

/* Границы зон по вероятности P — подгонка на графике, не часть расчёта */
const ZB = {yellow:30, red:60};
const zoneOfP = P => P>=ZB.red?2:P>=ZB.yellow?1:0;
const ZONES=[
 {n:'Зелёная',h:'Вероятнее всего, вас не взломают',c:'#2E8B57',txt:'Вы малозаметны и неплохо защищены. Остаются массовые схемы, которые бьют по всем подряд, и потеря данных без всякого взлома.'},
 {n:'Жёлтая',h:'Вероятно, вас взломают в ближайшие пять лет',c:'#D4A017',txt:'Либо вы заметны, либо у вас открыты входы. Целенаправленная атака — вопрос времени и мотива, а не возможности.'},
 {n:'Красная',h:'Вероятно, вас взломают в ближайший год',c:'#C0392B',txt:'Вы заметны, у вас есть что взять, и входы открыты. Это не прогноз, а описание того, как вы выглядите со стороны сейчас.'},
];
const LV=['низкая','средняя','высокая'];

function chart(r){
  const W=320,H=320,p=40, n=20; const cw=(W-2*p)/n;
  let g='';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const x=(i+0.5)/n*100, y=(j+0.5)/n*100; const P=0.45*x+0.55*(100-y); const z=zoneOfP(P);
    g+=`<rect x="${p+i*cw}" y="${p+(n-1-j)*cw}" width="${cw+0.5}" height="${cw+0.5}" fill="${ZONES[z].c}" opacity="0.18"/>`; }
  const px=p+(r.expX/100)*(W-2*p), py=p+(1-r.protY/100)*(H-2*p);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px;display:block;margin:0 auto" role="img" aria-label="Вероятность быть взломанным">
   ${g}
   <line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="currentColor" stroke-width="1.2"/>
   <line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="currentColor" stroke-width="1.2"/>
   <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="currentColor">Насколько вы заметны →</text>
   <text x="12" y="${H/2}" text-anchor="middle" font-size="12" fill="currentColor" transform="rotate(-90 12 ${H/2})">Насколько вы защищены →</text>
   <text x="${p+22}" y="${p+16}" font-size="10" fill="${ZONES[0].c}" font-weight="600">вероятнее всего, не взломают</text>
   <text x="${W/2}" y="${H/2+4}" text-anchor="middle" font-size="10" fill="${ZONES[1].c}" font-weight="600">в ближайшие 5 лет</text>
   <text x="${W-p-6}" y="${H-p-8}" text-anchor="end" font-size="10" fill="${ZONES[2].c}" font-weight="600">в ближайший год</text>
   <circle cx="${px}" cy="${py}" r="11" fill="${ZONES[r.zone].c}" opacity=".25"/>
   <circle cx="${px}" cy="${py}" r="6" fill="${ZONES[r.zone].c}" stroke="#fff" stroke-width="2"/>
   <text x="${px}" y="${py-14}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">вы здесь</text>
  </svg>`;
}

function scenCard(t){
  return `<div class="q"><p class="t">${t.name}</p>
   <p class="why" style="margin-bottom:8px">${t.sc}</p>
   <p style="font-size:14px;margin:0 0 10px"><b>Чем заканчивается.</b> ${t.end}</p>
   <p style="font-size:14px;margin:0 0 4px"><b>Что сделать самому:</b></p>
   <ul style="margin:0 0 6px 18px;padding:0;font-size:14px;color:var(--ink-2)">${t.act.map(a=>`<li>${a}</li>`).join('')}</ul>
   ${t.help?'<p class="hint" style="margin:0">Часть мер требует рук специалиста.</p>':''}
   <div class="meta"><span class="tag">${t.id}</span><span class="tag branch">${t.att}</span><span class="tag branch">реализует ${t.th.join(', ')}</span><span class="tag branch">вероятность ${t.p}/5</span></div></div>`;
}

function renderDone(el){
  const r = calc(); const z = ZONES[r.zone];
  const risk3 = v => v>=15?'высокий':v>=8?'средний':'низкий';
  let html = `<p class="section-title">Результат</p><h2 style="color:${z.c}">${z.n} зона</h2>
  <p class="lead"><b>${z.h}.</b> ${z.txt}</p>
  ${chart(r)}
  <p class="hint" style="text-align:center;margin:6px 0 18px">Горизонты — оценочные, по опыту разборов инцидентов, а не статистика.</p>
  <div class="note"><b>Вероятность быть взломанным: ${r.P}/100.</b> Заметность ${r.expX}/100 (известность ${r.known}/7, ценность для злоумышленника ${r.gain}/12) · защищённость ${r.protY}/100 (открытых входов ${r.reach}/15, пробелов ${r.gaps} из ${r.appl} проверенных мер). На графике — только вероятность; размер потерь учитывается ниже, в рисках.${r.irr?' <b>Среди значимых рисков есть необратимые.</b>':''}</div>`;
  // Угрозы
  html += `<h3 style="font-size:17px;margin:22px 0 8px">Угрозы: что у вас можно отнять</h3><p class="hint" style="margin:0 0 10px">Складываются из ваших активов. Ущерб — по пятибалльной шкале с учётом необратимости и того, что вы назвали самым важным.</p><div class="summary">`;
  r.threats.forEach(th=>{ const d=Math.min(5, th.dmg()+(th.irr?1:0)+(th.m54===val('54')?1:0)); html+=`<div class="row"><span class="k">${th.id}</span><span><b>${th.name}</b> <span class="hint" style="display:inline">· ${th.asset}</span><br><span style="font-size:14px;color:var(--ink-2)">${th.how} <i>${th.rev}</i></span><br><span class="a">ущерб ${d}/5${th.irr?' · необратимо':''}</span></span></div>`; });
  html += `</div>`;
  // Сценарии
  html += `<h3 style="font-size:17px;margin:22px 0 8px">Сценарии: как это могут сделать</h3><p class="hint" style="margin:0 0 10px">Сработали ${r.scen.length} из ${T.length}. Вероятность — из общей вероятности взлома (${r.P}) плюс усиливающие обстоятельства.</p><div class="summary">`;
  [...r.scen].sort((a,b)=>b.p-a.p).forEach(sc=>{ html+=`<div class="row"><span class="k">${sc.id}</span><span>${sc.entry?'★ ':''}${sc.name}<br><span class="a">вероятность ${sc.p}/5</span> <span class="hint" style="display:inline">· реализует ${sc.th.join(', ')}</span></span></div>`; });
  html += `</div>`;
  // Риски
  html += `<h3 style="font-size:17px;margin:22px 0 8px">Риски: угроза × сценарий</h3><p class="hint" style="margin:0 0 10px">Риск = вероятность сценария × ущерб угрозы, от 1 до 25. Показаны первые десять.</p><div class="summary">`;
  r.risks.slice(0,10).forEach(x=>{ html+=`<div class="row"><span class="k">${x.risk}</span><span><b>${x.th.name}</b><br><span style="font-size:14px;color:var(--ink-2)">через «${x.sc.name}»</span><br><span class="a">${risk3(x.risk)}: вероятность ${x.p} × ущерб ${x.d}</span></span></div>`; });
  html += `</div>`;
  // Карточки главных сценариев
  html += `<h3 style="font-size:17px;margin:22px 0 10px">Через что войдут</h3>` + (r.entry.length?r.entry.map(scenCard).join(''):'<p class="hint">Открытых входов среди основных не найдено.</p>');
  html += `<h3 style="font-size:17px;margin:22px 0 10px">Что после этого потеряете</h3>` + (r.cons.length?r.cons.map(scenCard).join(''):'<p class="hint">Крупных последствий не набралось — это хороший знак.</p>');
  html += `<h3 style="font-size:17px;margin:22px 0 10px">Если это уже случилось: первый час</h3><div class="q"><ul style="margin:0 0 0 18px;padding:0;font-size:14px;color:var(--ink-2)">
   <li>Отключить пострадавшее устройство от интернета, не выключать</li><li>С чистого устройства сменить пароль почты и завершить все чужие входы</li><li>Позвонить в банк по номеру с карты, заблокировать переводы</li><li>Предупредить семью и тех, кто платит по вашей просьбе: «от меня ничего не выполнять»</li><li>Сделать скриншоты уведомлений и списка устройств — до любых изменений</li></ul>
   ${val('53')===2?'<p class="hint" style="margin:8px 0 0">Вы ответили, что не знаете, что делать в первый час, — сохраните этот список.</p>':''}</div>`;
  html += `<div class="note" style="margin-top:14px"><b>Ещё один совет.</b> Договоритесь с близким человеком, как он получит доступ к важным для семьи и бизнеса аккаунтам, если вы окажетесь недоступны. Безопасность — не только чтобы чужие не вошли, но и чтобы свои смогли.</div>`;
  html += `<details style="margin-top:20px;font-size:13px;color:var(--ink-2)"><summary style="cursor:pointer">Разбор расчёта (для ревью)</summary>
   <p>Заметность ${r.known}/7, ценность ${r.gain}/12, мотив инсайдера ${r.motive}/3 → X=${r.expX}.<br>
   Открытых входов ${r.reach}/15, пробелы ${r.gaps} из ${r.appl} мер (доля ${r.gapRatio.toFixed(2)}) → уязвимость ${r.vulnV}, защищённость Y=${r.protY}.<br>
   P = 0,45·X + 0,55·(100−Y) = ${r.P}; зона по границам ${ZB.yellow}/${ZB.red}: ${z.n}. Необратимость точку не двигает.<br>
   Пробелы по вопросам: ${r.gapList.join(', ')||'—'}.</p>
   <p>Вероятность сценария = round(1 + 3·P/100 + 0,5·min(вес,3)), в пределах 1–5. Ущерб угрозы = базовый (1–5) + 1 за необратимость + 1 за совпадение с вопросом 54, не выше 5.</p>
   <div class="summary">${S.filter(s=>s.q&&(!s.showIf||s.showIf(A))).map(s=>s.q.filter(q=>!q.showIf||q.showIf(A)).map(q=>{const v=q.type==='single'?q.o[A[q.id]]:(A[q.id]||[]).map(i=>q.o[i]).join(', ');return `<div class="row"><span class="k">${q.id}</span><span>${q.t}<br><span class="a">${v||'—'}</span></span></div>`;}).join('')).join('')}</div></details>`;
  el.innerHTML = html;
}

$('#next').onclick = ()=>{ const list=visible(); if (list[cur].screen==='done'){ for (const k in A) delete A[k]; cur=0; } else cur++; render(); window.scrollTo({top:0}); };
$('#back').onclick = ()=>{ if (cur>0) cur--; render(); window.scrollTo({top:0}); };
$('#codes').onchange = e => document.body.classList.toggle('nocodes', !e.target.checked);
$('#debug').onchange = e => { DEBUG = e.target.checked; render(); };
render();
</script>
