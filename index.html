<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Cyber Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#1B2233; --ink-2:#4A5568; --ink-3:#8A94A6;
  --line:#D6DCE5; --accent:#0F6E68; --accent-soft:#DCEFEC;
  --green:#2E8B57; --yellow:#D4A017; --orange:#E07B16; --red:#C0392B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141922; --paper:#1D2430; --ink:#EEF1F5; --ink-2:#B9C2D0; --ink-3:#7E889A; --line:#2E3745;
  --accent:#4DB6AC; --accent-soft:#1F3A38
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 18px 150px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin-bottom:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;min-width:0}
header .brand{font-weight:600;font-size:15px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .risk-label{font-size:13px;color:var(--ink-2);text-align:right;flex:none;white-space:nowrap}
header .risk-label b{color:var(--ink)}
.risk{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.risk i{display:block;height:100%;width:0;border-radius:5px;background:var(--green);transition:width .35s ease,background-color .35s ease}
.progress{display:flex;gap:4px;margin:10px 0 0}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.cur{background:var(--accent);opacity:.5}
.section-title{font-size:13px;color:var(--ink-3);margin:0 0 4px}
h1{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;margin:26px 0 8px}
p.lead{font-size:18px;color:var(--ink-2);margin:0 0 16px}
.q{background:var(--paper);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;border:1px solid var(--line)}
.q .t{font-weight:600;font-size:17px;margin:0 0 6px}
.q .why{font-size:14px;color:var(--ink-2);margin:0 0 12px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:16px;line-height:1.35;background:var(--paper)}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--ink-3);border-radius:6px;margin-top:2px;position:relative}
.opt.radio .box{border-radius:50%}
.opt.on .box{border-color:var(--accent);background:var(--accent)}
.opt.on .box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.nav .msg{max-width:640px;margin:0 auto 8px;font-size:14px;color:var(--red);text-align:center;min-height:0}
button{font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:14px 18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);flex:1}
button.primary.off{opacity:.45}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
button.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
.note{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15px;color:var(--ink-2);margin:0 0 18px}
.note b{color:var(--ink)}
.th{padding:12px 0;border-bottom:1px solid var(--line)}
.th .n{font-weight:600}
.th .s{font-size:14px;color:var(--ink-2);margin-top:2px}
.big{font-size:40px;font-weight:700;line-height:1.1;margin:0 0 6px}
.form{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}
.form h3{margin:0 0 6px}
.form p{margin:0 0 14px;font-size:15px;color:var(--ink-2)}
.form label{display:block;font-size:14px;color:var(--ink-2);margin:0 0 4px}
.form input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:0 0 12px}
.form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.form input.bad{border-color:var(--red)}
.form .err{font-size:14px;color:var(--red);margin:0 0 10px}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .q{animation:in .18s ease-out} @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <header>
      <div class="brand">Family Cyber Office</div>
      <div class="risk-label" id="risklabel">Угрозы: <b>0 из 76</b> · 0 %</div>
    </header>
    <div class="risk"><i id="riskfill"></i></div>
    <div class="progress" id="progress"></div>
  </div>
  <div id="screen"></div>
</div>
<div class="nav">
  <div class="msg" id="navmsg"></div>
  <div class="in">
    <button id="back">Назад</button>
    <button id="next" class="primary">Дальше</button>
  </div>
</div>

<script>
/* ---------- технологии ---------- */
const TECH = [
 {id:'1', name:'Google', label:'Google: Gmail, Диск, Фото, YouTube'},
 {id:'2', name:'Apple', label:'Apple: iPhone, iPad, Mac'},
 {id:'3', name:'Телефон', label:'Смартфон: блокировка, SIM-карта, обновления'},
 {id:'4', name:'Компьютер', label:'Компьютер или ноутбук'},
 {id:'5', name:'Криптовалюта', label:'Криптовалюта'},
 {id:'6', name:'Искусственный интеллект', label:'Искусственный интеллект: ChatGPT, DeepSeek, Алиса и другие'},
 {id:'7', name:'Банковские приложения', label:'Банковские приложения'},
 {id:'8', name:'VPN', label:'VPN'},
 {id:'9', name:'Wi-Fi', label:'Wi-Fi: дома и в поездках'},
 {id:'10', name:'Мессенджеры и соцсети', label:'Мессенджеры и соцсети'},
];

/* ---------- экраны и вопросы ---------- */
// type: single | multi; d: пояснение под вопросом; none: исключающие варианты (число или список);
// ex: пары взаимоисключающих вариантов; showIf: условие показа.
// Привязка ответов к угрозам: 02_вопросы_и_тексты.md и 03_угрозы_по_технологиям.md
const S = [
{ id:'T', screen:'tech', title:'С какой стороны к вам можно подобраться?',
  lead:'У каждой привычной технологии есть обратная сторона. Отметьте те, которыми пользуетесь, и мы покажем, что из этого касается именно вас.',
  q:[ {id:'T',type:'multi',t:'Какими из этих технологий вы пользуетесь?',d:'',o:TECH.map(t=>t.label)} ]},

{ id:'1', tech:'1', title:'Google', lead:'Почта, Диск, Фото и всё, что к ним привязано.', q:[
 {id:'1',type:'multi',t:'Какими сервисами Google вы пользуетесь?',
  d:'Всё это один аккаунт. Кто получает к нему доступ, получает и почту, и файлы, и привязанные к нему сервисы, поэтому важно знать, что именно в нём лежит.',
  o:['Gmail как основная почта: на неё зарегистрированы банки и сервисы','Диск и Фото: документы, сканы, семейный архив','Календарь и Контакты: встречи, телефоны партнёров','Пароли сохраняются в Chrome','Вход на сайты кнопкой «Войти через Google»','YouTube-канал с подписчиками','К аккаунту привязана карта: Google Play, Google Pay','Почта компании работает на Google (Google Workspace)','Ничего из этого'],none:8},
 {id:'2',type:'multi',t:'Что Google запрашивает у вас при входе с нового устройства, кроме пароля?',
  d:'Второй шаг при входе защищает аккаунт, даже если пароль узнали. Надёжнее всего код из приложения, подтверждение на телефоне или ключ. Код из СМС слабее: его перехватывают вместе с номером.',
  o:['Ничего, только пароль','Код из СМС','Код из приложения или подтверждение на телефоне','Ключ доступа или физический ключ','Не знаю'],none:[0,4]},
 {id:'3',type:'single',t:'Используете ли вы пароль от Google ещё где-нибудь?',
  d:'Пароли утекают с чужих сайтов регулярно. Если пароль от Google такой же, как на другом сайте, его подберут из утечки.',
  o:['Нет, он уникальный','Да, такой же или похожий','Не помню']},
 {id:'4',type:'single',t:'Сможете ли вы войти в Google, если потеряете телефон, на который приходят коды?',
  d:'Без второго устройства или резервных кодов доступ к аккаунту теряется вместе с телефоном. Восстановление через Google долгое и часто не удаётся. Резервные коды выдаются в настройках безопасности аккаунта, их распечатывают и хранят дома.',
  o:['Да, есть резервные коды или второе устройство, где вход сохранён','Нет','Не знаю']},
 {id:'5',type:'single',t:'Проверяете ли вы, какие устройства и приложения подключены к вашей учётной записи Google?',
  d:'В настройках аккаунта виден список устройств, где выполнен вход, и приложений с доступом к почте и файлам. Проверка раз в несколько месяцев показывает, не сидит ли в аккаунте кто-то посторонний.',
  o:['Регулярно проверяю','Проверял(а) один раз','Никогда не проверял(а)','Не знаю, где это посмотреть']},
]},

{ id:'2', tech:'2', title:'Apple', lead:'Учётная запись, iCloud и устройства.', q:[
 {id:'6',type:'multi',t:'Какими устройствами и сервисами Apple вы пользуетесь?',
  d:'Все устройства Apple связаны одной учётной записью. От того, что в неё входит, зависит, что можно потерять при её захвате.',
  o:['iPhone','iPad','Mac','Общая с кем-то учётная запись или семейная группа с геопозицией','Только учётная запись, без устройств'],none:4},
 {id:'7',type:'single',t:'Включена ли двухфакторная проверка для вашей учётной записи Apple?',
  d:'Двухфакторная проверка означает, что при входе с нового устройства кроме пароля нужен второй шаг: код, который Apple показывает на ваших устройствах или присылает в СМС. Без неё учётную запись захватывают по одному паролю. У современных учётных записей она включена с момента создания.',
  o:['Да, код приходит на мои устройства или в СМС','Да, и настроен физический ключ безопасности','Нет','Не знаю']},
 {id:'8',type:'multi',t:'Как на ваш iPhone попали приложения российских банков?',
  d:'В App Store их нет, поэтому приложения ставят через чужую учётную запись Apple или по ссылкам. Если на телефоне остаётся чужая учётная запись, её владелец может заблокировать телефон удалённо.',
  o:['Не ставил(а)','В отделении банка, через учётную запись сотрудника','В салоне связи или магазине при покупке телефона','С помощью знакомого или «помощника», который входил в свою учётную запись','По ссылке «успейте скачать, пока не удалили» или под другим названием','По ссылке с сайта банка или через веб-версию','Другим способом','Не помню'],none:0},
 {id:'9',type:'single',t:'Что вы храните в iCloud?',
  d:'В iCloud лежат фото, заметки и резервная копия телефона. Кто захватил учётную запись, скачивает всё это целиком, поэтому документы и пароли в заметках и фото повышают цену потери.',
  o:['Фото, заметки, копии, в том числе документы или пароли','Фото и копии, без документов','Почти ничего','Не знаю']},
 {id:'10',type:'single',showIf:()=>has('6',0)||has('6',1),t:'Включена ли на iPhone «Защита украденного устройства»?',
  d:'Эта настройка (Настройки → Face ID и код-пароль) защищает от схемы, когда код подсматривают и выхватывают телефон. Вне дома и работы просмотр паролей и смена пароля Apple требуют Face ID, заменить его кодом нельзя, а на смену пароля даётся час задержки.',
  o:['Да','Нет','Не знаю']},
 {id:'11',type:'single',t:'Есть ли у вас контакт или ключ восстановления учётной записи Apple?',
  d:'Если пароль забыт, а доверенный номер сменился, учётную запись можно не вернуть. Контакт для восстановления (доверенный человек) или ключ восстановления назначаются в Настройки → ваше имя → Вход и безопасность.',
  o:['Да','Нет','Не знаю']},
]},

{ id:'3', tech:'3', title:'Телефон', lead:'Система, блокировка, приложения, номер.', q:[
 {id:'12',type:'single',t:'Какая система на телефоне, где у вас банки и важные данные?',
  d:'От системы зависит, можно ли поставить приложение в обход магазина и как долго телефон получает обновления. Если телефонов несколько, отвечайте про тот, где банки и мессенджеры.',
  o:['iOS (iPhone)','Android с сервисами Google: Samsung, Xiaomi, Google и другие','HarmonyOS или Android без Google: Huawei, Honor','Российская или защищённая система: Аврора и подобные','Несколько телефонов на разных системах','Кнопочный телефон','Другая','Не знаю']},
 {id:'13',type:'single',showIf:()=>inn('12',[1,2,3,4,6,7]),t:'Ставили ли вы приложения не из официального магазина (RuStore, App Store, Google Play), по ссылке или файлом?',
  d:'Приложение, полученное файлом или по ссылке, магазин не проверял. Именно так приходят «обновления банка» и «улучшенные» мессенджеры, которые читают коды из СМС и управляют телефоном.',
  o:['Нет','Да: VPN, игры, версии мессенджеров','Да, в том числе «обновление» банка или госприложения','Не уверен(а)']},
 {id:'14',type:'single',t:'Что вы делаете, если звонят «из банка», «из поддержки» или «из доставки» и просят назвать код, поставить программу или показать экран?',
  d:'Так звонят от имени банка, оператора связи, Госуслуг, службы доставки, полиции. Код из СМС, программа удалённого доступа или показ экрана отдают звонящему управление вашими деньгами. Настоящий сотрудник ничего из этого не просит.',
  o:['Отказываю и кладу трубку','Бывало, что соглашался(-ась)','Не уверен(а), что откажу']},
 {id:'15',type:'single',t:'Устанавливаете ли вы обновления системы на телефоне?',
  d:'Обновления закрывают найденные уязвимости. Производитель выпускает их ограниченное время: недорогие Android 2–4 года, после чего телефон остаётся с известными дырами. Телефон с root, jailbreak или неофициальной прошивкой защиту системы теряет.',

 {id:'16',type:'multi',t:'Что защитит ваш телефон, если он попадёт в чужие руки?',

  o:['Код из шести и более знаков или биометрия с таким кодом','Банки и мессенджеры просят свой код или лицо','Знаю, как найти или стереть телефон удалённо','Коды из СМС и текст сообщений не видны на заблокированном экране','PIN-код на SIM-карте','Ничего из этого','Не знаю'],none:[5,6]},
 {id:'17',type:'single',t:'Подключён ли у вашего оператора запрет на замену SIM-карты без личного визита?',
  d:'Если номер переоформят на другого человека по доверенности или через сговор в салоне, к нему уйдут все коды из СМС. Запрет означает, что любые действия с номером возможны только при вашем визите с паспортом. У МТС это «Запрет действий по доверенности», у Билайна «Дополнительная защита от замены SIM», у МегаФона заявление в офисе.',
  o:['Да','Нет','Не знал(а), что так можно']},
]},

{ id:'4', tech:'4', title:'Компьютер', lead:'Домашний или личный компьютер: система, программы, браузер.', q:[
 {id:'18',type:'multi',t:'Какая система стоит на вашем компьютере?',
  d:'От системы зависит, получает ли компьютер обновления и шифрует ли он диск сам. Windows 10 обновления безопасности больше не получает. Российские системы вроде Astra Linux от обычного Linux для домашнего пользователя отличаются мало. Если компьютеров несколько, отметьте все системы.',

 {id:'19',type:'multi',t:'Есть ли на компьютере нелицензионные программы?',
  d:'Пиратские «сборки» Windows, активаторы и взломанные игры часто несут скрытую программу, которая выгружает пароли из браузера и открытые входы на сайты. Нелицензионная Windows к тому же обычно не получает обновлений.',
  o:['Windows: «сборка», активатор, ключ с торговой площадки','Рабочие программы: Word, AutoCAD и подобные','Игры','Другое','Не знаю','Ничего, всё лицензионное'],none:[4,5]},
 {id:'20',type:'single',t:'Есть ли копии важных файлов на других носителях: флешке, в облаке, на другом компьютере?',
  d:'Вирус-шифровальщик делает файлы нечитаемыми и требует выкуп. Если копия документов и фото лежит отдельно, платить не за что.',
  o:['Да','Нет','Не знаю']},
 {id:'21',type:'single',t:'Кто и откуда устанавливает программы на ваш компьютер?',
  d:'Поддельные сайты «скачать бесплатно» стоят в поиске выше настоящих, а расширения браузера видят всё, что открыто на экране. Безопасно ставить программы с сайтов разработчиков и из магазинов, расширений держать минимум. Мастер по объявлению часто ставит пиратские сборки.',
  o:['Сам(а), с сайтов разработчиков и из магазинов, расширений минимум','Сам(а), по первой ссылке из поиска','Сам(а), по-разному, не слежу','Мастер по объявлению','Свой проверенный системный администратор']},
 {id:'22',type:'multi',t:'Кто ещё может пользоваться вашим компьютером?',
  d:'Под одной учётной записью все делят файлы, пароли и права: игра с вредоносом, поставленная ребёнком, получает доступ к входам родителей. Отдельные учётные записи защищают друг от друга, но не от того, у кого права администратора. Удалённый доступ опасен, когда мастер или «поддержка» могут подключиться, не спрашивая вас.',
  o:['Семья, под той же учётной записью','Семья, под своими учётными записями','Мастер или «поддержка» могут подключаться удалённо без моего подтверждения','Никто','Не знаю, кто настраивал'],none:[3,4]},
 {id:'23',type:'single',t:'Зашифрован ли диск вашего компьютера?',
  d:'Все файлы лежат на диске внутри компьютера. Если диск не зашифрован, его вынимают и читают на другом компьютере, пароль на вход не мешает. Шифрование (BitLocker в Windows, FileVault в macOS) делает диск нечитаемым без вашего пароля. macOS и Windows 11 обычно шифруют диск сами.',
  o:['Да, диск зашифрован','Нет, не зашифрован','Не знаю','Не зашифрован, и пароля на вход нет']},
]},

{ id:'5', tech:'5', title:'Криптовалюта', lead:'', q:[
 {id:'24',type:'multi',t:'Какие варианты хранения криптовалюты вы используете?',
  d:'На бирже деньги зависят от биржи: её взламывают, она блокирует россиян или закрывается. В кошельке на телефоне деньги зависят от телефона и от фразы восстановления. Аппаратный (холодный) кошелёк хранит ключи отдельно от интернета.',
  o:['На бирже, основную часть','На бирже, небольшую часть','В кошельке на телефоне, в браузере или в мессенджере','На аппаратном кошельке (холодный кошелёк)','У посредника или управляющего','Не знаю'],none:5},
 {id:'25',type:'multi',showIf:()=>has('24',0)||has('24',1),t:'Как вы подтверждаете операции на бирже: вывод, перевод?',
  d:'Если вывод подтверждается только кодом из СМС или почты, захват почты или номера отдаёт все средства. Код из приложения, физический ключ и список разрешённых адресов для вывода оставляют вора без возможности вывести деньги, даже зная пароль.',
  o:['Код из приложения (Google Authenticator) или физический ключ (YubiKey)','Список разрешённых адресов для вывода','Код из СМС или почты','Биометрия','Платёжный пароль биржи (fund password)','Не знаю'],none:5},
 {id:'26',type:'single',t:'Как вы храните код восстановления кошелька (seed-фразу)?',
  d:'Seed-фраза это 12–24 слова, которые кошелёк выдаёт при создании. Кто знает фразу, владеет деньгами, поэтому в заметках, фото и облаке она уходит вместе с аккаунтом. Надёжное хранение: записана на бумаге или металлической пластине (она не горит) и лежит в надёжном месте.',
  o:['На бумаге или металлической пластине, в надёжном месте','В заметках, фото, облаке или переписке','В менеджере паролей','Не записывал(а)','Не знаю, что это']},
 {id:'27',type:'single',t:'Покупаете или продаёте криптовалюту через P2P: у частных лиц, в обменниках, через знакомых?',
  d:'P2P это обмен напрямую с другим человеком: вы переводите рубли на его карту или получаете рубли на свою. Деньги покупателя могут оказаться украденными, и тогда блокируют вашу карту; а при покупке криптовалюта может просто не прийти.',
  o:['Нет','Да']},
]},

{ id:'6', tech:'6', title:'Искусственный интеллект', lead:'ChatGPT, Claude, DeepSeek, GigaChat, Алиса и другие.', q:[
 {id:'28',type:'multi',t:'Через что вы пользуетесь ИИ?',
  d:'Официальный сайт или приложение хранят ваши запросы у разработчика. Бот в мессенджере или купленный аккаунт добавляют посредника, который видит всё, что вы пишете, и может читать историю.',
  o:['Официальные сайты и приложения','Боты в мессенджерах','Купленный аккаунт или оплата через посредника','Общий аккаунт с кем-то','Не знаю, что за сервис'],none:4},
 {id:'29',type:'single',t:'Загружаете ли вы в ИИ документы, переписку, личные или финансовые данные?',
  d:'Загруженный файл остаётся на серверах сервиса, может использоваться для обучения и попасть к посторонним при утечке. Чужие данные (клиентов, сотрудников) к тому же нельзя передавать без их согласия.',
  o:['Нет, только общие вопросы','Иногда','Регулярно','Да, в том числе данные клиентов или сотрудников']},
 {id:'30',type:'single',t:'Используете ли вы ИИ для юридических, финансовых или медицинских вопросов и документов?',
  d:'В этих темах ИИ уверенно приводит несуществующие нормы, решения и дозировки, а цена ошибки высокая. Сами документы, договоры, выписки и декларации, при загрузке уходят на сервер сервиса.',
  o:['Нет','Да, задаю вопросы без документов','Да, загружаю документы']},
 {id:'31',type:'single',t:'Есть ли у ИИ-помощника доступ к вашей почте, файлам или браузеру?',
  d:'Помощник с доступом не только читает, но и действует: отправляет письма, меняет файлы, переходит по ссылкам. Его можно обмануть скрытым текстом в письме или на странице, и он выполнит чужую команду. Безопаснее, когда каждое действие подтверждаете вы.',
  o:['Нет','Да, каждое действие подтверждаю','Да, действует сам','Не знаю']},
 {id:'32',type:'single',t:'Берёте ли вы готовые промпты и ИИ-помощников из интернета?',
  d:'Длинный промпт из чата или готовый помощник из каталога может содержать скрытую инструкцию: искажать расчёт, вставлять ссылки, отправлять ваши данные наружу. Защита одна: прочитать целиком перед использованием.',
  o:['Нет','Да, читаю целиком перед использованием','Да, не читая','Не знаю, что это']},
]},

{ id:'7', tech:'7', title:'Банковские приложения', lead:'Приложения, звонки «из банка» и настройки безопасности.', q:[
 {id:'33',type:'single',t:'Как установлены приложения банков на вашем телефоне?',
  d:'Приложения ряда банков удалены из магазинов, и «новые версии» присылают ссылкой или файлом. Поддельное приложение собирает логин и коды, а на Android просит приложить карту и ввести PIN, после чего деньги снимают в банкомате. Безопасный источник: магазин приложений, отделение банка или сайт банка.',
  o:['Из App Store, Google Play, RuStore','В отделении банка','По ссылке или файлом','Через посредника, или не уверен(а)','Не помню']},
 {id:'34',type:'single',t:'Что вы делаете, если звонят «из банка» и сообщают о подозрительной операции?',
  d:'Это самая частая схема: «служба безопасности», «Центробанк» или «следователь» ведут к переводу на «безопасный счёт», к курьеру или к кредиту «для спасения денег». Единственное надёжное действие: положить трубку и самому позвонить в банк по номеру с карты.',
  o:['Кладу трубку и звоню в банк по номеру с карты','Выслушиваю, без проверки ничего не делаю','Выполняю, если звучит убедительно','Не уверен(а)']},
 {id:'35',type:'single',t:'Приходят ли вам уведомления о каждой операции по счёту (push или СМС)?',
  d:'Без уведомлений чужое списание замечают через дни или недели, а заявить о нём в банк по закону нужно не позднее следующего дня после уведомления об операции. Безопасно: уведомления включены о каждой операции по всем картам и счетам.',
  o:['Да, о каждой операции','Только о крупных или не по всем картам','Нет, отключил(а): они платные или мешают','Не знаю']},
 {id:'36',type:'single',t:'Проверяете ли вы, с каких устройств выполнен вход в приложение банка?',
  d:'В списке устройств виден старый телефон, устройство «помощника», который ставил приложение, или аппарат из отделения. У Сбера это Профиль → Настройки → Безопасность → «Управление приложениями на других устройствах», у других банков похожий раздел. Лишние устройства отключаются там же.',
  o:['Регулярно проверяю и отключаю лишние','Проверял(а) один раз','Никогда','Не знаю, где это']},
 {id:'37',type:'single',t:'Сохранена ли ваша карта в браузере, на маркетплейсах, в приложениях доставки и такси?',
  d:'Сохранённая карта уходит вместе с аккаунтом магазина или с паролями браузера, и ею платят без вас. Безопасно: для оплат в интернете отдельная виртуальная карта с небольшим остатком, основная карта нигде не сохранена.',
  o:['Да, во многих местах','В одном-двух','Нет, ввожу данные каждый раз','Для интернета у меня отдельная виртуальная карта']},
 {id:'38',type:'single',t:'Привязаны ли ваши банковские аккаунты к вашему основному номеру телефона?',
  d:'Если банковские аккаунты привязаны не к вашему основному номеру, вы можете потерять доступ к ним. Например, номер из-за долгой неактивности продали другому человеку, и коды от банка приходят ему.',
  o:['Да, к основному номеру','Нет, к другому номеру, которым пользуюсь редко','Нет, к номеру, оформленному на родственника или компанию','Не знаю']},
 {id:'39',type:'single',t:'Знаете ли вы, как за минуту заблокировать карты и вход в банк, если телефон украли?',
  d:'С украденного разблокированного телефона деньги переводят за минуты. Безопасно: знать номер банка с обратной стороны карты и уметь заблокировать карты и вход в приложение с другого устройства.',
  o:['Да, знаю номер банка и умею с другого устройства','Нет','Не думал(а) об этом']},
]},

{ id:'8', tech:'8', title:'VPN', lead:'Кто владеет сервером, тот видит ваш трафик.', q:[
 {id:'40',type:'multi',t:'Каким VPN вы пользуетесь?',
  d:'Весь ваш интернет проходит через сервер владельца VPN. Он видит, куда и когда вы ходите, и может этим торговать. Бесплатные сервисы зарабатывают на вашем трафике, продавцы из мессенджеров исчезают с деньгами, расширения браузера видят всё на экране. Безопасный вариант один: собственный сервер; известный платный сервис тоже видит трафик, но ему есть что терять.',
  o:['Известным платным сервисом','Собственным сервером','Бесплатным приложением','Расширением браузера','Купленным через бота или частного продавца','Не знаю, что это за сервис'],none:5},
 {id:'41',type:'single',t:'Как вы установили VPN?',
  d:'Приложение из магазина проверено магазином. Файл или ссылка из чата могут оказаться банковским трояном под видом «рабочего VPN».',
  o:['Из магазина приложений','По ссылке или файлом','Не помню']},
 {id:'42',type:'single',t:'Просили ли вас при настройке VPN установить «сертификат» или «профиль» по инструкции?',
  d:'Настоящему VPN сертификат для работы не нужен. Установленный сертификат позволяет владельцу сервиса читать защищённые соединения: страницы банка и почты, пароли и коды.',
  o:['Нет','Да','Не помню']},
]},

{ id:'9', tech:'9', title:'Wi-Fi', lead:'Домашний роутер и сети вне дома.', q:[
 {id:'43',type:'single',t:'Кто задавал пароли на вашем роутере?',
  d:'У роутера два пароля: от сети Wi-Fi и от страницы настроек. Заводской пароль настроек знает любой, кто подключился к сети, и через настройки подменяют адреса сайтов. Пароль от Wi-Fi, который задал мастер провайдера, известен не только вам. Безопасно, когда оба пароля задали вы сами.',
  o:['Я сам(а) задал(а) оба: от Wi-Fi и от настроек','Сам(а) менял(а) только пароль от Wi-Fi','Сам(а) менял(а) только пароль от настроек','Мастер провайдера или кто-то другой, я не менял(а)','Не знаю']},
 {id:'44',type:'single',t:'Даёте ли вы пароль от Wi-Fi гостям и работникам?',
  d:'Телефон няни, мастера или гостя оказывается в одной сети с вашими компьютерами, а выданный пароль остаётся у человека навсегда. Гостевая сеть в роутере даёт интернет, но не доступ к вашим устройствам.',
  o:['Нет','Да, от основной сети','Да, есть отдельная гостевая сеть']},
 {id:'45',type:'multi',t:'Какие умные устройства подключены к вашему домашнему Wi-Fi?',
  d:'Камера, телевизор или розетка с заводским паролем и без обновлений становится входом в домашнюю сеть, а через камеру смотрят за домом.',
  o:['Камеры','Телевизор, колонка, приставка','Розетки, датчики, замки','Нет','Не знаю'],none:[3,4]},
 {id:'46',type:'single',t:'Пользуетесь ли вы Wi-Fi в кафе, гостиницах, аэропортах, и что там делаете?',
  d:'Само подключение и просмотр видео почти безопасны: содержимое сайтов зашифровано. Опасна поддельная сеть с таким же названием: её страница входа просит номер и код из СМС, и так угоняют аккаунт мессенджера. Код из СМС в Wi-Fi вводить не нужно никогда.',
  o:['Не пользуюсь, только мобильный интернет','Да, но только читаю и смотрю, в банки не захожу','Да, пользуюсь всем, включая банки и мессенджеры','Ввожу номер и код из СМС, если сеть просит']},
]},

{ id:'10', tech:'10', title:'Мессенджеры и соцсети', lead:'Telegram, WhatsApp, Max, ВКонтакте и другие.', q:[
 {id:'47',type:'multi',t:'Какими мессенджерами и соцсетями вы пользуетесь?',
  d:'В каждом аккаунте лежит переписка, контакты и часто документы. Чем больше аккаунтов, тем больше входов, которые нужно защитить.',
  o:['Telegram','WhatsApp','Max','ВКонтакте','Viber','Другие']},
 {id:'48',type:'single',t:'Что вы делаете, если доверенный человек (близкий, руководитель, коллега) пишет в мессенджере и просит перевести деньги или назвать код?',
  d:'Так пишут с угнанного аккаунта или с его копии: «займи до вечера», «переведите на безопасный счёт», «назовите код». Надёжная проверка: позвонить по известному номеру или спросить кодовое слово. Уточнение в той же переписке не помогает, отвечает тот же мошенник.',
  o:['Звоню по известному номеру, или есть кодовое слово','Уточняю в той же переписке','Выполняю, если похоже на правду','Не уверен(а)']},
 {id:'49',type:'single',t:'Проверяете ли вы список устройств, на которых выполнен вход в ваши мессенджеры?',
  d:'Список есть в настройках любого мессенджера. Проверка раз в пару месяцев показывает, не читает ли переписку кто-то с чужого устройства: старого телефона, рабочего компьютера, устройства бывшего партнёра.',
  o:['Регулярно проверяю','Проверял(а) один раз','Никогда не проверял(а)','Не знаю, где это']},
 {id:'50',type:'multi',t:'Делаете ли вы что-то из перечисленного?',
  d:'«Фото» от незнакомого оказывается установочным файлом, «улучшенная» версия мессенджера передаёт переписку автору, а документы в «Избранном» получает тот, кто вошёл в аккаунт.',
  o:['Открываю файлы и ссылки от незнакомых','Пользуюсь неофициальной «улучшенной» версией мессенджера','Храню в переписке или «Избранном» фото документов, карт или пароли','Ничего из этого','Не уверен(а)'],none:[3,4]},
 {id:'51',type:'single',t:'Ведёте ли вы в мессенджере переписку с банком, бухгалтером или партнёрами?',
  d:'В рабочих чатах лежат реквизиты, счета и условия сделок. При угоне аккаунта всё это читают, а от вашего имени меняют реквизиты в чате с партнёром.',
  o:['Нет','Да']},
 {id:'52',type:'single',t:'Ведёте ли вы канал, группу или страницу с подписчиками?',
  d:'Канал, привязанный к личному аккаунту единственного администратора, теряется вместе с аккаунтом. Второй администратор и отдельный аккаунт для канала позволяют его вернуть.',
  o:['Нет','Да, есть второй администратор и отдельный аккаунт','Да, веду с личного аккаунта, администратор только я']},
]},

{ id:'11', tech:'11', title:'Известность', lead:'Чем больше о вас известно, тем точнее обман.', q:[
 {id:'53',type:'multi',t:'Насколько вы известны за пределами своего круга?',
  d:'Чем проще найти сведения о вас, тем убедительнее письмо «от организаторов конференции» или «от партнёра» с деталями реальной сделки. Публичные видео дают материал для подделки голоса.',

];
const TOTAL = TH.length;

/* ---------- расчёт ---------- */
function calc(){
  const r = {open:[], closed:[], byTech:{}};
  TH.forEach(th=>{
    if(!techOn(th.tech)) return;
    const opened = th.base || (th.open && th.open());
    const closed = th.close ? th.close() : false;
    const b = r.byTech[th.tech] || (r.byTech[th.tech]={open:[],closed:[]});
    if(opened && !closed){ const amp = th.amp ? !!th.amp() : false; r.open.push({...th, amp}); b.open.push({...th, amp}); }
    else if(opened && closed){ r.closed.push(th); b.closed.push(th); }
  });
  r.pct = Math.round(100*r.open.length/TOTAL);
  r.level = r.pct===0?0 : r.pct<=25?1 : r.pct<=50?2 : r.pct<=75?3 : 4;
  return r;
}
const COLORS = ['var(--line)','var(--green)','var(--yellow)','var(--orange)','var(--red)'];

function updateBar(r){
  $('#riskfill').style.width = r.pct+'%';
  $('#riskfill').style.backgroundColor = COLORS[r.level];
  $('#risklabel').innerHTML = `Угрозы: <b>${r.open.length} из ${TOTAL}</b> · ${r.pct} %`;
}

/* ---------- отрисовка ---------- */
const complete = s => (s.q||[]).filter(q=>!q.showIf||q.showIf()).every(q=> q.type==='single' ? A[q.id]!==undefined : Array.isArray(A[q.id])&&A[q.id].length>0);

function render(){
  const list = visible(); if (cur >= list.length) cur = list.length-1;
  const s = list[cur]; const el = $('#screen'); el.innerHTML='';
  const r = calc(); updateBar(r);
  const steps = list.filter(x=>x.screen!=='done');
  $('#progress').innerHTML = steps.map(x=>{ const idx=list.indexOf(x); return `<i class="${idx<cur?'done':idx===cur?'cur':''}"></i>`; }).join('');
  $('#navmsg').textContent = '';
  if (s.screen==='done'){ renderDone(el, r); $('#back').style.visibility='visible'; $('#next').textContent='Сначала'; $('#next').classList.remove('off'); return; }
  $('#back').style.visibility = cur===0?'hidden':'visible'; $('#next').textContent='Дальше';
  const qs = s.q.filter(q=>!q.showIf||q.showIf());
  el.innerHTML = s.screen==='tech' ? `<h1>${s.title}</h1><p class="lead">${s.lead}</p>` : `<h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}`;
  qs.forEach(q=>{
    const d = document.createElement('div'); d.className='q';
    const num = s.screen==='tech' ? '' : `<span style="color:var(--ink-3);font-weight:500">${q.id}.</span> `;
    d.innerHTML = `<p class="t">${num}${q.t}</p>${q.d?`<p class="why">${q.d}</p>`:''}<div class="opts"></div>`;
    const box = d.querySelector('.opts');
    const noneSet = new Set(q.none===undefined||q.none===null ? [] : [].concat(q.none));
    const exOf = i => (q.ex||[]).filter(p=>p.includes(i)).map(p=>p[0]===i?p[1]:p[0]);
    q.o.forEach((label,i)=>{
      const o = document.createElement('div'); o.className='opt'+(q.type==='single'?' radio':''); o.tabIndex=0;
      o.innerHTML = `<span class="box"></span><span>${label}</span>`;
      const on = ()=> q.type==='single' ? A[q.id]===i : Array.isArray(A[q.id])&&A[q.id].includes(i);
      if (on()) o.classList.add('on');
      const pick = ()=>{
        if (q.type==='single'){ A[q.id]=i; }
        else { let arr = Array.isArray(A[q.id])?[...A[q.id]]:[];
          if (arr.includes(i)) arr=arr.filter(x=>x!==i);
          else { if (noneSet.has(i)) arr=[]; else arr=arr.filter(x=>!noneSet.has(x));
                 const ex=exOf(i); arr=arr.filter(x=>!ex.includes(x)); arr.push(i); }
          A[q.id]=arr; }
        render(); window.scrollTo({top:window.scrollY});
      };
      o.onclick=pick; o.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();pick();} };
      box.appendChild(o);
    });
    el.appendChild(d);
  });
  $('#next').classList.toggle('off', !complete(s));
}

function renderDone(el, r){
  const color = r.level===0 ? 'var(--green)' : COLORS[r.level];
  const safe = 100 - r.pct;
  let html = `<p class="section-title">Результат</p>
  <p class="big" style="color:${color}">Вы защищены на ${safe} %</p>
  <p class="lead">Угроз: ${r.open.length} из ${TOTAL}</p>`;
  if(!contact){
    html += `<div class="form" id="form">
      <h3>Получить подробный отчёт</h3>
      <p>Укажите контакты, и мы покажем полный список угроз с пояснениями и пришлём отчёт на почту.</p>
      <label for="f-name">ФИО</label><input id="f-name" type="text" autocomplete="name">
      <label for="f-mail">Почта</label><input id="f-mail" type="email" autocomplete="email" inputmode="email">
      <label for="f-tel">Телефон</label><input id="f-tel" type="tel" autocomplete="tel" inputmode="tel">
      <p class="err" id="f-err"></p>
      <button class="primary" id="f-send" style="width:100%">Получить отчёт</button>
    </div>`;
    el.innerHTML = html;
    $('#f-send').onclick = submitForm;
    return;
  }
  html += `<div class="note">Отчёт отправлен на <b>${esc(contact.mail)}</b>.</div>
  <h2 style="font-size:22px;margin-top:8px">Угрозы, которым вы подвержены</h2>`;
  const order = [...TECH.map(t=>t.id), '11'];
  order.forEach(id=>{
    const b = r.byTech[id]; if(!b) return;
    const name = id==='11' ? 'Известность' : TECH.find(t=>t.id===id).name;
    html += `<h3>${name}</h3>`;
    if(!b.open.length){ html += `<p class="th" style="color:var(--ink-3)">Открытых угроз нет.</p>`; return; }
    const sorted = [...b.open].sort((a,c)=>(c.amp-a.amp));
    html += `<div>` + sorted.map(th=>`<div class="th"><div class="n">${th.name}</div><div class="s">${th.sc}</div></div>`).join('') + `</div>`;
  });
  el.innerHTML = html;
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function submitForm(){
  const name = $('#f-name').value.trim(), mail = $('#f-mail').value.trim(), tel = $('#f-tel').value.trim();
  const digits = tel.replace(/\D/g,'');
  const bad = [];
  if(!name) bad.push('f-name');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) bad.push('f-mail');
  if(digits.length<10||digits.length>15) bad.push('f-tel');
  ['f-name','f-mail','f-tel'].forEach(id=>$('#'+id).classList.toggle('bad', bad.includes(id)));
  if(bad.length){ $('#f-err').textContent='Заполните все поля: ФИО, почту и телефон.'; return; }
  contact = {name, mail, tel};            // заглушка: данные никуда не отправляются
  render(); window.scrollTo({top:0});
}

function shakeNext(s){
  const b = $('#next'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  $('#navmsg').textContent = s.screen==='tech' ? 'Отметьте хотя бы одну технологию.' : 'Вы ответили не на все вопросы этого экрана.';
}

$('#next').onclick = ()=>{
  const list=visible(); const s=list[cur];
  if (s.screen==='done'){ for (const k in A) delete A[k]; contact=null; cur=0; }
  else if (!complete(s)){ shakeNext(s); return; }
  else cur++;
  render(); window.scrollTo({top:0});
};
$('#back').onclick = ()=>{ if (cur>0) cur--; render(); window.scrollTo({top:0}); };
render();
</script>
</body>
</html>
