<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Cyber Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#1B2233; --ink-2:#4A5568; --ink-3:#8A94A6;
  --line:#D6DCE5; --accent:#0F6E68; --accent-soft:#DCEFEC;
  --green:#2E8B57; --yellow:#D4A017; --orange:#E07B16; --red:#C0392B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141922; --paper:#1D2430; --ink:#EEF1F5; --ink-2:#B9C2D0; --ink-3:#7E889A; --line:#2E3745;
  --accent:#4DB6AC; --accent-soft:#1F3A38
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 18px 150px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin-bottom:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;min-width:0}
header .brand{font-weight:600;font-size:15px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .risk-label{font-size:13px;color:var(--ink-2);text-align:right;flex:none;white-space:nowrap}
header .risk-label b{color:var(--ink)}
.risk{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.risk,header .risk-label{transition:opacity .45s ease,transform .45s ease}
.risk.off,.risk-label.off{opacity:0;transform:translateY(-4px);pointer-events:none}
.risk i.snap{transition:none}
@media (prefers-reduced-motion:reduce){ .risk,header .risk-label,.risk i{transition:none} }
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:0 0 14px}
.dash .pct-row{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.dash .pct{font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dash .cap{font-size:14px;color:var(--ink-2)}
.dash .bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.dash .bar i{display:block;height:100%;border-radius:7px}
.peri-title{font-size:22px;margin:22px 0 10px}
.peri p{margin:0;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.peri p:first-child{border-top:0;padding-top:0}
.peri p{display:flex;align-items:baseline;gap:10px}
.peri p .num{font-size:22px;line-height:1;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.peri .bg{font-size:13px;color:var(--ink-3);border-top:0;padding:10px 0 0}
.hint{font-size:14px;color:var(--ink-3);line-height:1.45;margin:0 0 10px}
.card .hint{margin-bottom:6px}
.card .th:first-child{padding-top:0}
.card .th:last-child{border-bottom:0;padding-bottom:0}
.card.zone h3{margin:0 0 8px}
.card.next{background:var(--accent-soft);border-color:transparent}
.card.next h3{margin:0 0 6px}
.card.next p{margin:0;font-size:15px;color:var(--ink-2)}
.th.muted{color:var(--ink-3);font-size:15px}
.closed-links{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.th.muted{border-bottom:0;padding-bottom:6px}
.th + .closed-links{border-top:0;margin-top:0;padding-top:6px}   /* черту уже даёт строка выше: без двойной линии (Ст43) */
.closed-links .hint{margin:0 0 6px}
.cl{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-3);padding:3px 0}
.ck{flex:none;width:16px;height:16px;color:var(--green);vertical-align:-3px;margin-right:6px}
.cl .ck{margin:0}
.gate{position:relative;overflow:hidden}
.veil{max-height:140px;overflow:hidden;filter:blur(4px);opacity:.6;user-select:none;pointer-events:none}
.gate .veil .th{border-bottom:0}
.gate .veil::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to bottom,transparent,var(--paper))}
.card.form{margin-top:14px}
.veil{transition:filter .7s ease,opacity .7s ease,max-height .7s ease}
.veil.open{filter:none;opacity:1;max-height:2000px;user-select:auto;pointer-events:auto}
.gate .veil.open::after{opacity:0;transition:opacity .4s ease}
.gate .veil::after{transition:opacity .4s ease}
.card.form.thanks{padding:0;border:0;background:none}
.card.form.thanks .note{margin:0}
.reveal{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){ .veil,.reveal,.gate .veil::after{transition:none} }
.actions{display:flex;gap:10px;margin:22px 0 0}
.actions button{flex:1}
.nav.off{display:none}
.wrap.done{padding-bottom:40px}
.opt-label{color:var(--ink-3);font-weight:400}
.th .tag{display:inline-block;font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.th .tag.first{color:var(--red);border-color:var(--red)}
.risk i{display:block;height:100%;width:0;border-radius:5px;background:var(--green);transition:width .35s ease,background-color .35s ease}
.progress{display:flex;gap:4px;margin:10px 0 0}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.cur{background:var(--accent);opacity:.5}
.section-title{font-size:13px;color:var(--ink-3);margin:0 0 4px}
h1{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;margin:26px 0 8px}
p.lead{font-size:18px;color:var(--ink-2);margin:0 0 16px}
.q{background:var(--paper);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;border:1px solid var(--line)}
.q .t{font-weight:600;font-size:17px;margin:0 0 6px}
.q .why{font-size:14px;color:var(--ink-2);margin:0 0 12px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:16px;line-height:1.35;background:var(--paper)}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--ink-3);border-radius:6px;margin-top:2px;position:relative}
.opt.radio .box{border-radius:50%}
.opt.on .box{border-color:var(--accent);background:var(--accent)}
.opt.on .box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.nav .msg{max-width:640px;margin:0 auto 8px;font-size:14px;color:var(--red);text-align:center;min-height:0}
button{font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:14px 18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);flex:1}
button.primary.off{opacity:.45}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
button.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
.note{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15px;color:var(--ink-2);margin:0 0 18px}
.note b{color:var(--ink)}
.note.safe{border-color:var(--accent);display:flex;gap:12px;align-items:flex-start}
.note.safe svg{flex:none;width:22px;height:22px;margin-top:1px;color:var(--accent)}
.intro .cta{font-size:20px;font-weight:700;margin:22px 0 10px;color:var(--ink)}
.intro .sub{font-size:17px;color:var(--ink-2);margin:0 0 6px}
.th{padding:12px 0;border-bottom:1px solid var(--line)}
.th .n{font-weight:600}
.th .s{font-size:14px;color:var(--ink-2);margin-top:2px}
.th.link .n{color:var(--accent)}
.closed{font-size:13px;color:var(--ink-3);margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.big{font-size:40px;font-weight:700;line-height:1.1;margin:0 0 6px}
.form{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}
.form h3{font-size:18px}
.form h3{margin:0 0 6px}
.form p{margin:0 0 14px;font-size:15px;color:var(--ink-2)}
.form label{display:block;font-size:14px;color:var(--ink-2);margin:0 0 4px}
.form input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:0 0 12px}
.form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.form input.bad{border-color:var(--red)}
.form .err{font-size:14px;color:var(--red);margin:0 0 10px}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .q{animation:in .18s ease-out} @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top">
    <header>
      <div class="brand">Family Cyber Office</div>
      <div class="risk-label off" id="risklabel"></div>
    </header>
    <div class="risk off" id="riskbar"><i id="riskfill"></i></div>
    <div class="progress" id="progress"></div>
  </div>
  <div id="screen"></div>
</div>
<div class="nav" id="nav">
  <div class="msg" id="navmsg"></div>
  <div class="in">
    <button id="back">Назад</button>
    <button id="next" class="primary">Дальше</button>
  </div>
</div>

<script>
/* ---------- технологии ---------- */
const TECH = [   // порядок «от центра личности наружу» (Ст33, Word [365])
 {id:'1', name:'Google', label:'Google: Gmail, Диск, Фото, YouTube'},
 {id:'2', name:'Apple', label:'Apple: iPhone, iPad, Mac'},
 {id:'3', name:'Телефон', label:'Смартфон: блокировка, SIM-карта, обновления'},
 {id:'4', name:'Компьютер', label:'Компьютер или ноутбук'},
 {id:'10', name:'Мессенджеры и социальные сети', label:'Мессенджеры и социальные сети'},
 {id:'7', name:'Банки и платежи', label:'Банки и платежи'},
 {id:'5', name:'Криптовалюта', label:'Криптовалюта'},
 {id:'9', name:'Wi-Fi', label:'Домашний и публичный Wi-Fi'},
 {id:'8', name:'VPN', label:'VPN'},
 {id:'6', name:'Искусственный интеллект', label:'Искусственный интеллект: ChatGPT, DeepSeek, Алиса и другие'},
];

/* ---------- экраны и вопросы ---------- */
// type: single | multi; d: пояснение под вопросом; none: исключающие варианты (число или список);
// ex: пары взаимоисключающих вариантов; showIf: условие показа.
// Привязка ответов к угрозам: 02_вопросы_и_тексты.md и 03_угрозы_по_технологиям.md
const S = [
{ id:'0', screen:'intro', title:'Карта ваших цифровых рисков',
  sub:'Покажите, из чего состоит ваша цифровая жизнь, а мы покажем, через какие элементы могут пострадать ваши деньги, данные, аккаунты и близкие.',
  cta:'Проверьте свою цифровую безопасность',
  paras:['Наша цель: помочь вам выстроить безопасный цифровой периметр, спокойно пользоваться технологиями и понимать, что делать и к кому обратиться, если что-то произойдёт.',
         'Этот бесплатный тест покажет, что у вас уже защищено, где есть слабые места и что можно исправить самостоятельно уже сейчас.',
         'Чем точнее ваши ответы, тем полезнее будет ваш персональный результат.'],
  safe:'Это безопасная проверка: мы не просим сообщать пароли, коды, данные карт, документы или другую конфиденциальную информацию.',
  button:'Начать проверку' },
{ id:'T', screen:'tech', title:'Чем вы пользуетесь в цифровой жизни?',
  lead:'Телефон, почта, банки, мессенджеры, домашняя сеть и другие сервисы связаны между собой. Проблема в одном месте иногда открывает доступ сразу к нескольким другим.',
  q:[ {id:'T',type:'multi',t:'Отметьте всё, чем вы пользуетесь.',d:'Мы проверим основные точки риска именно в вашей цифровой среде.',o:TECH.map(t=>t.label)} ]},

{ id:'1', tech:'1', title:'Google', lead:'Почта, Диск, Фото и всё, что к ним привязано.', q:[
 {id:'2',type:'single',t:'Как защищён вход в ваш Google-аккаунт?',
  d:'Через Google часто восстанавливаются другие аккаунты, хранятся почта, фотографии, документы и резервные копии. Надёжнее всего подтверждение в приложении, на телефоне или ключом. Код из СМС слабее: его перехватывают вместе с номером. Если СМС включена наряду с приложением, выберите СМС.',
  o:['Пароль и дополнительное подтверждение: в приложении, на телефоне или ключом','Пароль и код из СМС','Вхожу только по паролю','Не помню / не знаю']},
 {id:'4',type:'single',t:'Сможете ли вы восстановить доступ к Google, если потеряете основной телефон?',
  d:'Телефон часто используется для подтверждения входа и восстановления аккаунта. Важно заранее понимать, сможете ли вы вернуть доступ без него. Резервные коды выдаются в настройках безопасности аккаунта, их распечатывают и хранят дома.',
  o:['Да, у меня есть другой способ восстановления и я понимаю, что делать','Наверное, смогу, но специально не проверял(а)','Нет / не знаю']},
 {id:'1',type:'multi',showIf:()=>answered('2')&&val('2')!==0,t:'Что хранится в вашем Google-аккаунте?',
  d:'Всё это один аккаунт. Кто входит в него, получает и почту, и файлы, и привязанные сервисы, поэтому важно знать, что именно в нём лежит.',
  o:['Диск и Фото: документы, сканы, семейный архив','Календарь и Контакты: встречи, телефоны партнёров','Пароли сохраняются в Chrome','Вход на сайты кнопкой «Войти через Google»','YouTube-канал с подписчиками','К аккаунту привязана карта: Google Play, Google Pay','Почта компании работает на Google (Google Workspace)','Ничего из этого'],none:7},
]},

{ id:'2', tech:'2', title:'Apple', lead:'Учётная запись, iCloud и устройства.', q:[
 {id:'6',type:'multi',t:'Какими устройствами и сервисами Apple вы пользуетесь?',
  d:'Все устройства Apple связаны одной учётной записью. От того, что в неё входит и как на телефон попали приложения банков, зависит, что можно потерять.',
  o:['iPhone','iPad','Mac','В iCloud лежат документы, сканы или пароли: в заметках, фото или файлах','Общая с кем-то учётная запись или семейная группа с геопозицией','Приложения банков ставили через чужую учётную запись Apple: в отделении, салоне связи или с помощью «помощника»','Приложения банков ставили по ссылке «успейте скачать, пока не удалили» или под другим названием','Только учётная запись, без устройств'],none:7},
 {id:'7',type:'single',t:'Включено ли дополнительное подтверждение входа в вашу учётную запись Apple?',
  d:'Учётная запись Apple даёт доступ к фотографиям, резервным копиям, паролям и другим данным. Дополнительное подтверждение усложняет вход постороннему человеку. Код на ваших устройствах Apple надёжнее кода в СМС: СМС перехватывают вместе с номером.',
  o:['Да, код приходит на мои устройства Apple или есть ключ безопасности','Да, но код приходит только в СМС на номер телефона','Нет','Не знаю']},
 {id:'10',type:'single',showIf:()=>has('6',0)||has('6',1),t:'Включена ли «Защита украденного устройства»?',
  d:'Эта функция усложняет изменение критически важных настроек, если телефон оказался у другого человека. Включается в Настройки → Face ID и код-пароль. Вне дома и работы смена пароля Apple и просмотр паролей требуют Face ID, заменить его кодом нельзя, а на смену пароля даётся час задержки.',
  o:['Да','Нет','Не знаю']},
 {id:'11',type:'single',t:'Понимаете ли вы, как восстановить учётную запись Apple, если потеряете телефон?',
  d:'Потеря телефона не должна одновременно означать потерю доступа к учётной записи. Важно заранее понимать, какие способы восстановления у вас остаются. Контакт для восстановления (доверенный человек) или ключ восстановления назначаются в Настройки → ваше имя → Вход и безопасность.',
  o:['Да, у меня есть понятный способ восстановления','Думаю, что смогу через другое устройство Apple или номер','Нет / не знаю']},
]},

{ id:'3', tech:'3', title:'Телефон', lead:'Приложения, обновления, блокировка, номер.', q:[
 {id:'13',type:'single',t:'Устанавливаете ли вы приложения не из официального магазина приложений?',
  d:'Приложения из неизвестных источников могут содержать вредоносные функции или запрашивать больше доступа к телефону, чем вы ожидаете. Именно так приходят «обновления банка» и «улучшенные» мессенджеры, которые читают коды из СМС и управляют телефоном.',
  o:['Нет','Иногда, если доверяю источнику','Да, устанавливаю файлы или приложения из разных источников','Не знаю, откуда устанавливаются приложения']},
 {id:'15',type:'single',t:'Ваш телефон регулярно получает и устанавливает обновления безопасности?',
  d:'Обновления исправляют найденные уязвимости. Чем дольше устройство работает без них, тем больше известных способов атаки могут оставаться незакрытыми. Производитель выпускает обновления ограниченное время: недорогие Android 2–4 года. Телефон с root, jailbreak или неофициальной прошивкой защиту системы теряет.',
  o:['Да, обновления устанавливаются регулярно','Иногда откладываю обновления надолго','Телефон давно не обновляется','Не знаю']},
 {id:'16',type:'single',t:'Что защищает ваш телефон, если его украдут уже разблокированным или узнают код?',

const raw = id => shown(id) ? A[id] : undefined;
const has = (q,i)=>Array.isArray(raw(q))&&raw(q).includes(i);
const hasAny = (q,arr)=>arr.some(i=>has(q,i));
const val = q=>{ const v=raw(q); return Array.isArray(v)?undefined:v; };
const inn = (q,arr)=>arr.includes(val(q));
const answered = q=>{ const v=raw(q); return v!==undefined && !(Array.isArray(v)&&v.length===0); };
const visible = () => S.filter(s => !s.tech || techOn(s.tech));
// сквозные вопросы экрана s: те, у кого s — первый отмеченный экран из списка зон
// сквозной вопрос показывается на экране зоны q.first, если она отмечена, иначе на первом отмеченном экране из q.zones (Ст46)
const homeOf = q => (q.first && visible().find(x => x.tech === q.first)) || visible().find(x => x.tech && q.zones.includes(x.tech));
const sharedFor = s => s.tech ? SHARED.filter(q => homeOf(q) === s) : [];
// сквозной вопрос с pos:'first' стоит первым на экране (Ст49, звонок «из банка» у Андрея первый в блоке банков); остальные сквозные после вопросов зоны
const qsOf = s => { const sh = sharedFor(s); return [...sh.filter(q=>q.pos==='first'), ...(s.q||[]), ...sh.filter(q=>q.pos!=='first')].filter(q => !q.showIf || q.showIf()); };

];
const TOTAL = TH.length;

/* ---------- расчёт (Ст20, Ст22) ----------
   Состояния актуальной угрозы (зона отмечена):
   bg (фоновая): base без условия close либо флаг bg:true: не зависит от ответов, в процент не входит; если у неё сработало amp, она становится first (Ст25);
   rel(): необязательное условие относимости; если ложно, угроза не считается вовсе (Ст29).
   closed: не открылась ответами либо открылась и снята;
   attn (требует внимания): открыта, не снята, без усиления;
   first (в первую очередь): открыта, не снята, усилена.
   Защищённость = (closed + ½·attn) / (closed + attn + first). */
function calc(){
  const r = {closed:[], attn:[], first:[], bg:[], byTech:{}};
  TH.forEach(th=>{
    if(!techOn(th.tech)) return;
    if(th.rel && !th.rel()) return;                 // угроза не относится к этому человеку (Ст29)
    const b = r.byTech[th.tech] || (r.byTech[th.tech]={gaps:[], bg:[], closed:[]});
    const controllable = !th.bg && (!!th.close || !!th.open);   // bg:true — фоновая по решению, а не по отсутствию close
    if(!controllable){
      // фоновая угроза, но усиливающий ответ делает её пробелом «в первую очередь» (Ст25)
      if(th.amp && th.amp()){ const item={...th, amp:true}; r.first.push(item); b.gaps.push(item); }
      else { r.bg.push(th); b.bg.push(th); }
      return;
    }
    const opened = th.base || (th.open && th.open());
    const closed = th.close ? th.close() : false;
    if(opened && !closed){
      const amp = th.amp ? !!th.amp() : false;
      const item = {...th, amp};
      (amp ? r.first : r.attn).push(item); b.gaps.push(item);
    } else { r.closed.push(th); b.closed.push(th); }
  });
  r.ctrl = r.closed.length + r.attn.length + r.first.length;
  // Ст23: закрытая = 1, «требует внимания» = ½, «в первую очередь» = 0
  r.safe = r.ctrl ? Math.round(100*(r.closed.length + 0.5*r.attn.length)/r.ctrl) : 100;
  // цвет по методологии Ст23 (Ст51): 50 % = «каждая угроза хотя бы требует внимания» → жёлтая; ниже 25 % = в основном «в первую очередь» → красная; от 76 % → зелёная
  r.level = r.safe<25 ? 0 : r.safe<50 ? 1 : r.safe<=75 ? 2 : 3;
  r.zones = selTech().length;
  return r;
}
const COLORS = ['var(--red)','var(--orange)','var(--yellow)','var(--green)'];
const plural = (n, one, few, many) => { const m10=n%10, m100=n%100; return n+' '+(m10===1&&m100!==11 ? one : m10>=2&&m10<=4&&(m100<10||m100>=20) ? few : many); };

let barShown = false;
function updateBar(r, onTech){
  // на экране выбора зон полоски нет (Ст20), на экране результата её заменяет дашборд; между ними показывает защищённость.
  // При первом появлении: плавное проявление и заполнение от нуля до значения; дальше ширина и цвет меняются плавно (CSS transition).
  const bar = $('#riskbar'), fill = $('#riskfill'), label = $('#risklabel');
  const show = !onTech;
  if(show && !barShown){
    fill.classList.add('snap'); fill.style.width = '0%'; fill.style.backgroundColor = COLORS[r.level];
    void fill.offsetWidth;                       // зафиксировать нулевую ширину без перехода
    fill.classList.remove('snap');
    requestAnimationFrame(()=>{ fill.style.width = r.safe+'%'; });
  } else {
    fill.style.width = r.safe+'%';
    fill.style.backgroundColor = COLORS[r.level];
  }
  barShown = show;
  bar.classList.toggle('off', !show);
  label.classList.toggle('off', !show);
  label.innerHTML = `Защищённость: <b>${r.safe} %</b>`;
}

const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
// экран вступления (Ст35, Word [1–2], [23–31]): без полоски, без «Назад», кнопка «Начать проверку»
function renderIntro(el, s){

const complete = s => qsOf(s).every(q=> q.type==='single' ? A[q.id]!==undefined : Array.isArray(A[q.id])&&A[q.id].length>0);

function render(){

  const r = calc(); updateBar(r, s.screen==='tech' || s.screen==='done' || s.screen==='intro');   // на вступлении и экране T полоски ещё нет, на результате её заменяет дашборд
  const steps = list.filter(x=>x.screen!=='done' && x.screen!=='intro');
  $('#progress').innerHTML = (s.screen==='intro' || s.screen==='done') ? '' : steps.map(x=>{ const idx=list.indexOf(x); return `<i class="${idx<cur?'done':idx===cur?'cur':''}"></i>`; }).join('');
  $('#navmsg').textContent = '';
  $('#nav').classList.toggle('off', s.screen==='done');   // на результате кнопки внутри страницы (Ст40); снимается до вступления, иначе после «Пройти заново» нет кнопки «Начать проверку» (Ст43)
  $('#wrap').classList.toggle('done', s.screen==='done');
  if (s.screen==='intro'){ renderIntro(el, s); $('#back').style.visibility='hidden'; $('#next').textContent=s.button; $('#next').classList.remove('off'); return; }
  if (s.screen!=='done') doneAnimated = false;

  $('#back').style.visibility = cur===0?'hidden':'visible'; $('#next').textContent='Дальше';
  const qs = qsOf(s);
  el.innerHTML = s.screen==='tech' ? `<h1>${s.title}</h1><p class="lead">${s.lead}</p>` : `<h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}`;
  qs.forEach(q=>{
    const d = document.createElement('div'); d.className='q';
    const num = s.screen==='tech' ? '' : `<span style="color:var(--ink-3);font-weight:500">${qs.indexOf(q)+1}.</span> `;   // порядковый номер на экране (Ст48), id вопроса остаётся ключом в документах
    d.innerHTML = `<p class="t">${num}${q.t}</p>${q.d?`<p class="why">${q.d}</p>`:''}<div class="opts"></div>`;
    const box = d.querySelector('.opts');
    const noneSet = new Set(q.none===undefined||q.none===null ? [] : [].concat(q.none));
    const exOf = i => (q.ex||[]).filter(p=>p.includes(i)).map(p=>p[0]===i?p[1]:p[0]);
    q.o.forEach((label,i)=>{
      const o = document.createElement('div'); o.className='opt'+(q.type==='single'?' radio':''); o.tabIndex=0;
      o.innerHTML = `<span class="box"></span><span>${label}</span>`;
      const on = ()=> q.type==='single' ? A[q.id]===i : Array.isArray(A[q.id])&&A[q.id].includes(i);

          if (arr.includes(i)) arr=arr.filter(x=>x!==i);
          else { if (noneSet.has(i)) arr=[]; else arr=arr.filter(x=>!noneSet.has(x));
                 const ex=exOf(i); arr=arr.filter(x=>!ex.includes(x)); arr.push(i); }
          A[q.id]=arr; }
        render(); window.scrollTo({top:window.scrollY});
      };
      o.onclick=pick; o.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();pick();} };
      box.appendChild(o);

}

function renderDone(el, r){
  const color = COLORS[r.level];

    <p><b class="num" style="color:var(--green)">${r.closed.length}</b>уже хорошо ${one(r.closed.length)?'закрыт':'закрыты'} вашими настройками.</p>

    ${r.bg.length ? `<p class="bg">Ещё ${plural(r.bg.length,'сценарий касается','сценария касаются','сценариев касаются')} каждого, независимо от ответов. ${r.bg.length===1?'Он в отчёте вместе с советом':'Они в отчёте вместе с советом'}, что сделать.</p>` : ''}
  </div>`;
  // 3. Самые опасные связи: активные, затем закрытые (Э4.1, Ст36, Ст40)
  const ln = links(r), lc = linksClosed(r);
  html += `<h2 class="peri-title">Самые опасные связи</h2>
  <p class="hint">Мы анализируем не отдельные настройки, а связи между ними. Например, плохо защищённая почта может дать доступ к бирже, мессенджеру и другим аккаунтам, а украденный телефон одновременно затрагивает банк, почту и способы восстановления доступа.</p>
  <div class="card">`;
  html += ln.length ? ln.map(l=>`<div class="th link"><div class="n">${l.title}${l.weight===2?'<span class="tag first">в первую очередь</span>':''}</div><div class="s">${l.text}</div></div>`).join('')
                    : `<p class="th muted">По вашим ответам опасных связей между зонами не видно.</p>`;
  if(lc.length) html += `<div class="closed-links"><p class="hint">Закрыты вашими настройками</p>${lc.map(l=>`<div class="cl">${CHECK}<span>${l.title}</span></div>`).join('')}</div>`;
  html += `</div>`;
  if(!contact){

    const gaps = [...r.first, ...r.attn]; const top = topGaps(r); const rest = gaps.slice(top.length, top.length+3);
    html += `<h2 class="peri-title">Главные угрозы</h2><div class="card gate">`;
    html += top.length ? top.map(th=>row(th)).join('') : `<p class="th muted">Пробелов в защите по вашим ответам нет.</p>`;
    if(rest.length) html += `<div class="veil" aria-hidden="true">${rest.map(th=>row(th)).join('')}</div>`;
    html += `</div><div class="card form" id="form">
      <h3>Персональная карта рисков</h3>

    html += actionsHtml();
    el.innerHTML = html;

// полная карта рисков после контактов (Э5.1): используется и при обычной отрисовке, и при динамическом раскрытии (Ст42)
function reportHtml(r){
  const row = (th, cls='') => `<div class="th${cls}"><div class="n">${th.name}${th.amp?'<span class="tag first">в первую очередь</span>':''}</div><div class="s">${th.sc}</div></div>`;
  let html = `<h2 class="peri-title">Что именно может произойти</h2>`;
  const order = [...TECH.map(t=>t.id), '12', '11'];
  order.forEach(id=>{
    const b = r.byTech[id]; if(!b) return;
    const name = id==='11' ? 'Вы и ваше окружение' : id==='12' ? 'Основная почта' : TECH.find(t=>t.id===id).name;
    html += `<div class="card zone"><h3>${name}</h3>`;
    if(!b.gaps.length) html += `<p class="th muted">Пробелов в защите нет.</p>`;
    if(id==='11' && b.gaps.length) html += `<p class="hint">В открытых источниках можно собрать достаточно сведений о вас и ваших близких, а часть вашего окружения может выполнить сообщение от вашего имени без дополнительной проверки. Это риск мошенничества через доверие, даже если ваши аккаунты хорошо защищены.</p>`;
    html += [...b.gaps].sort((a,c)=>(c.amp-a.amp)).map(th=>row(th)).join('');
    if(b.closed.length) html += `<p class="closed">${CHECK}Закрыто вашими настройками: ${b.closed.map(t=>t.name).join('; ')}.</p>`;
    html += `</div>`;
  });
  // фоновые угрозы: отдельный блок в конце, как советы для каждого (Ст27)
  if(r.bg.length){
    html += `<div class="card zone"><h3>Касается каждого</h3>
    <p class="hint">Эти сценарии не зависят от ваших настроек, поэтому в процент защищённости они не вошли. От каждого защищает одна привычка, она названа в описании.</p>` + r.bg.map(th=>row(th)).join('') + `</div>`;
  }
  html += `<div class="card next"><h3>Что дальше</h3>
  <p>Эта проверка показывает крупные точки риска в вашей цифровой среде. Глубинная диагностика Cyber Office строит ваш цифровой паспорт: конкретные аккаунты, устройства, номера и почты, кто имеет доступ, как восстанавливать доступ, какие резервные копии есть и что делать при инциденте. Мы свяжемся с вами по оставленным контактам.</p></div>`;
  return html;
}
const thanksHtml = () => `<div class="note">${contact&&contact.name?`Спасибо, <b>${esc(contact.name)}</b>! `:'Спасибо! '}Ниже ваша полная карта рисков.</div>`;
const CHECK = '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
// кнопки экрана результата внутри страницы (нижняя панель на нём скрыта, Ст40)
const actionsHtml = () => `<div class="actions"><button id="d-back">К вопросам</button><button id="d-restart">Пройти заново</button></div>`;
function bindActions(){ const b=$('#d-back'), rs=$('#d-restart'); if(b) b.onclick=()=>{ if(cur>0) cur--; render(); window.scrollTo({top:0}); }; if(rs) rs.onclick=()=>{ restart(); }; }
function restart(){ for (const k in A) delete A[k]; contact=null; cur=0; doneAnimated=false; render(); window.scrollTo({top:0}); }
// анимация полоски и процента при открытии результата: проявление и заполнение от нуля (Ст40); повторно не играет, пока человек не уйдёт с экрана
let doneAnimated = false;
function animateDash(r){
  const pct = $('#d-pct'), fill = $('#d-fill');
  const reduce = typeof window.matchMedia==='function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || doneAnimated) return;
  doneAnimated = true;
  const dur = 1100, t0 = (typeof performance!=='undefined' ? performance.now() : Date.now());
  fill.style.width = '0%'; pct.textContent = '0 %';
  const step = now => { const k = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - k, 3);
    pct.textContent = Math.round(r.safe * e) + ' %'; fill.style.width = (r.safe * e) + '%'; if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

const LINKS = [

  text:'Помощник с доступом к почте и файлам действует от вашего имени: скрытая команда в письме или на странице уходит в ваши данные и переписку.'},

function links(r){
  const gap = new Map([...r.attn.map(t=>[t.id,1]), ...r.first.map(t=>[t.id,2])]);
  const out = [];
  for(const l of LINKS){ if(l.when && !l.when()) continue; const hit=l.th.filter(id=>gap.has(id)); if(!hit.length) continue;
    out.push({...l, hit, weight: Math.max(...hit.map(id=>gap.get(id)))}); }
  return out.sort((a,b)=>b.weight-a.weight).slice(0,4);

// закрытые связи (Ст40): угрозы связи актуальны для человека, но ни одна сейчас не пробел

function linksClosed(r){
  const gap = new Set([...r.attn, ...r.first].map(t=>t.id)); const closed = new Set(r.closed.map(t=>t.id));
  const answeredZone = tech => tech==='12' ? answered('58') : (!techOn(tech) || (()=>{ const sc = visible().find(x=>x.tech===tech); return !!sc && complete(sc); })());
  return LINKS.filter(l => l.th.some(id=>closed.has(id)) && !l.th.some(id=>gap.has(id)) && l.th.every(id => answeredZone(TH.find(t=>t.id===id).tech)));
}
// 2–3 главных сценария до контактов (Э5.1, Ст39; Word [396]): первоочередные, затем требующие внимания
const topGaps = r => [...r.first, ...r.attn].slice(0, Math.min(3, Math.max(2, r.first.length)));
// проверка формы (Э5.1): имя необязательно, телефон 10–15 цифр, почта по формату
function validateContact(c){ const bad=[]; const digits=(c.tel||'').replace(/\D/g,'');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.mail||'')) bad.push('f-mail'); if(digits.length<10||digits.length>15) bad.push('f-tel'); return bad; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function submitForm(){
  const name = $('#f-name').value.trim(), mail = $('#f-mail').value.trim(), tel = $('#f-tel').value.trim();
  const bad = validateContact({name, mail, tel});   // имя необязательно (Э5.1, Ст39)
  ['f-mail','f-tel'].forEach(id=>$('#'+id).classList.toggle('bad', bad.includes(id)));
  if(bad.length){ $('#f-err').textContent='Заполните обязательные поля.'; return; }
  contact = {name, mail, tel};            // заглушка: данные никуда не отправляются
  revealReport(calc());
}

// динамическое раскрытие отчёта после контактов (Ст42): страница не перерисовывается, а дорастает вниз
function revealReport(r){
  const veil = $('.veil'); if(veil) veil.classList.add('open');            // размытые строки проявляются
  const form = $('#form'); if(form){ form.classList.add('thanks'); form.innerHTML = thanksHtml(); }
  const old = $('.actions'); if(old && old.remove) old.remove();
  const more = document.createElement('div'); more.className = 'reveal';
  more.innerHTML = reportHtml(r) + actionsHtml();
  $('#screen').appendChild(more);
  bindActions();
  requestAnimationFrame(()=>{ more.classList.add('in'); const h = more.querySelector('h2'); if(h && h.scrollIntoView) setTimeout(()=>h.scrollIntoView({behavior:'smooth', block:'start'}), 250); });
}

function shakeNext(s){
  const b = $('#next'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  $('#navmsg').textContent = s.screen==='tech' ? 'Отметьте хотя бы одну зону.' : 'Вы ответили не на все вопросы этого экрана.';
}

$('#next').onclick = ()=>{
  const list=visible(); const s=list[cur];
  if (s.screen==='done'){ restart(); return; }
  if (!complete(s)){ shakeNext(s); return; }
  else cur++;
  render(); window.scrollTo({top:0});
};
$('#back').onclick = ()=>{ if (cur>0) cur--; render(); window.scrollTo({top:0}); };
render();
</script>
